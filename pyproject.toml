[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "compliance_auditor_env"
version = "1.0.0"
description = "Real-world compliance auditing environment for OpenEnv"
authors = [{ name = "xcoder18" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.104.1",
    "uvicorn==0.24.0",
    "pydantic==2.4.2",
    "openai==1.3.0",
    "python-dotenv==1.0.0",
]

[project.scripts]
compliance-auditor = "app:main"  # optional, but good for CLI

[tool.setuptools.packages.find]
where = ["."]
include = ["environment", "models", "graders", "app"]

[tool.openenv]
entrypoint = "app:app"
